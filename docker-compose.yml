services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering"]
      interval: 3s
      retries: 10

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      API_URL: http://service:3000
    depends_on:
      - service

volumes:
  pgdata: